name: Release

# Push a tag like v0.3.0 (after the version bump and CHANGELOG entry are merged)
# to build, zip and publish the app. The build is ad-hoc signed and not notarized.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Resources/Info.plist)"
          if [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Info.plist version $PLIST_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: scripts/release/notes.sh "$VERSION" --sha256 pending >/dev/null

      - name: Test
        run: make test

      - name: Build (ad-hoc signed)
        env:
          SIGN_ADHOC: "1"
        run: make app

      - name: Package
        run: |
          mkdir -p dist
          ZIP="dist/hyprMac-$VERSION.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/hyprMac.app "$ZIP"
          (cd dist && shasum -a 256 "hyprMac-$VERSION.zip" > "hyprMac-$VERSION.zip.sha256")
          SHA="$(awk '{ print $1 }' "$ZIP.sha256")"
          scripts/release/notes.sh "$VERSION" --sha256 "$SHA" > dist/notes.md
          codesign --verify --deep --strict build/hyprMac.app
          cat dist/notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/hyprMac-$VERSION.zip" "dist/hyprMac-$VERSION.zip.sha256" \
            --title "hyprMac $VERSION" --notes-file dist/notes.md $PRE
